# Manual staging deploy. Disabled in practice until ADR 0001 (projects created) and
# ADR 0004 (WIF roles) are accepted and the repository variables below are set:
#   GCP_WIF_PROVIDER_STAGING, GCP_DEPLOY_SA_STAGING
name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:alias -- staging joinery-staging
      - run: npm run build
        env:
          VITE_RELEASE_ID: ${{ github.sha }}
          VITE_FIREBASE_PROJECT_ID: joinery-staging
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY_STAGING }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN_STAGING }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET_STAGING }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID_STAGING }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ vars.GCP_DEPLOY_SA_STAGING }}
      - run: npx firebase deploy --project staging --non-interactive --message "release ${{ github.sha }}"
